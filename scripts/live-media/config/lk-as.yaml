# lk-jwt-service's application service registration (template; run.mjs fills
# in fresh tokens for each run).
id: "LiveKit JWT service"
as_token: "@@AS_TOKEN@@"
hs_token: "@@HS_TOKEN@@"
sender_localpart: "_lk_jwt_service"
namespaces:
  users:
    - exclusive: false
      regex: ".*"
url: null
io.element.msc4502.scopes: ["urn:matrix:client:io.element.msc4502:rooms:is_joined"]
io.element.msc4512.proxy_prefix: "rtc/livekit"
io.element.msc4512.proxy_url: "http://mc-media-jwt:8080"
