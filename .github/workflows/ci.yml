# Typecheck, tests with the 95% coverage gate, a build, a smoke test and an accessibility check (axe) of the built app, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Known vulnerabilities in what ships with the app (not build tools): high or worse fails.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  check:
    strategy:
      # Each system's result counts on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The keyboard hook (uiohook-napi) loads X11 libraries; its tests load it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst6 libxt6 libxinerama1 libxkbcommon-x11-0 libpipewire-0.3-0
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Smoke test: starts the built app offline with a scratch profile and checks it over DevTools (scripts/smoke.mjs).
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps without an AppArmor profile; Chromium's sandbox needs them.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run smoke
        timeout-minutes: 5
      - if: runner.os != 'Linux'
        run: npm run smoke
        timeout-minutes: 5
      # Accessibility: axe-core on the built pages with sample states (scripts/a11y.mjs); serious or critical fails.
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run a11y
        timeout-minutes: 8
      - if: runner.os != 'Linux'
        run: npm run a11y
        timeout-minutes: 8

  # Multicord for Android (mobile/android): its JVM unit tests (the shared network-policy fixture among them),
  # a debug build and an unsigned release build (R8), which bundle the desktop build's engines, native view and
  # shell page (hence npm run build first). No signing secrets: the release APK stays unsigned here. Lint
  # (lintDebug) fails on any error or warning not in app/lint-baseline.xml.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and checks the committed wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
      # The NDK and CMake that app/build.gradle.kts pins (the USB camera's native code); quick if the image has them.
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null'
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --no-daemon
        working-directory: mobile/android
        timeout-minutes: 20

  # The phase-0 Android spike (mobile/android-spike): only that it still builds.
  android-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android-spike
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and checks the committed wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
      # The NDK and CMake that app/build.gradle.kts pins (spike 0.5's native code); quick if the image has them.
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null'
        timeout-minutes: 10
      - run: ./gradlew assembleDebug --no-daemon
        timeout-minutes: 15
