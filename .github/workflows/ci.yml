# Typecheck, tests with the 95% coverage gate, a build and a smoke test of the built app, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Each system's result counts on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The keyboard hook (uiohook-napi) loads X11 libraries; its tests load it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst6 libxt6 libxinerama1 libxkbcommon-x11-0 libpipewire-0.3-0
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Smoke test: starts the built app offline with a scratch profile and checks it over DevTools (scripts/smoke.mjs).
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps without an AppArmor profile; Chromium's sandbox needs them.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run smoke
        timeout-minutes: 5
      - if: runner.os != 'Linux'
        run: npm run smoke
        timeout-minutes: 5
