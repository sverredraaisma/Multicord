# Typecheck, tests with the 95% coverage gate, and a build, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The keyboard hook (uiohook-napi) loads X11 libraries; its tests load it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst6 libxt6 libxinerama1 libxkbcommon-x11-0 libpipewire-0.3-0
      - run: npm ci
      - run: npm run check
      - run: npm run build
