<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Couldn't reach the service</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body class="unreachable-body">
  <main class="unreachable" aria-labelledby="unreachable-title">
    <svg class="unreachable-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 3.5 3.5 2.1l18.4 18.4-1.4 1.4-3.3-3.3H6a4 4 0 0 1-.9-7.9 6.9 6.9 0 0 1 1.3-3.7zM8 8.4a5 5 0 0 0-1 2.5l-.1.9-.9.1A2 2 0 0 0 6 16.6h9.2zM12 5a7 7 0 0 1 6.9 5.9A4.5 4.5 0 0 1 21 19l-1.4-1.4a2.5 2.5 0 0 0-1.5-4.6h-1V12a5 5 0 0 0-7.6-4.3L8 6.3A7 7 0 0 1 12 5z"/></svg>
    <h1 id="unreachable-title">Couldn't reach the service</h1>
    <p id="unreachable-reason"></p>
    <div class="unreachable-actions">
      <button id="unreachable-retry" class="unreachable-primary" type="button">Try again</button>
      <button id="unreachable-settings" class="unreachable-link" type="button">Open Settings</button>
    </div>
    <p id="unreachable-code" class="unreachable-code"></p>
  </main>
  <script src="unreachable.js"></script>
</body>
</html>
