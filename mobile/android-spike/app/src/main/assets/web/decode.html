<head>

  <title>Spike decode cost</title>

<body>
  <h1>Spike 0.4: MJPEG decode cost</h1>
  <p>30 bundled 720p JPEG frames (about 100 KB each, like a webcam's MJPEG) decoded with ImageDecoder into VideoFrames. Keep the screen on and the phone unplugged from power-saving modes while it runs.</p>
  <div class="buttons">
    <button id="fast">A: as fast as possible</button>
    <button id="realtime">B: 30 fps into a track, 10 s</button>
    <button id="both">Run A then B</button>
  </div>
  <video id="preview" autoplay muted playsinline></video>
  <pre id="log"></pre>
  <script src="spike.js"></script>
  <script src="decode.js"></script>
</body>
